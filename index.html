<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ei — Profile</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at top left, #39205f, transparent 45%),
        radial-gradient(circle at bottom right, #182b55, transparent 45%),
        #101116;

    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.window {
    width: 100%;
    max-width: 850px;
    min-height: 560px;
    background: rgba(25, 26, 32, 0.94);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 25px 80px rgba(0,0,0,.65);
}

.topbar {
    height: 45px;
    background: rgba(15,16,20,.95);
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 18px;
    padding: 0 18px;
    color: #aaa;
    font-size: 18px;
}

.profile {
    padding: 35px;
}

.avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg,#5865f2,#b45cff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    font-weight: bold;
    margin-bottom: 18px;
}

h1 {
    margin: 0;
    font-size: 34px;
}

.username {
    color: #a9adb5;
    margin-top: 5px;
    font-size: 16px;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 15px;
}

.online {
    width: 11px;
    height: 11px;
    background: #23a559;
    border-radius: 50%;
}

.section {
    margin-top: 28px;
}

.section-title {
    color: #b5bac1;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 10px;
}

.bio {
    color: #ddd;
    line-height: 1.6;
}

.badges {
    font-size: 25px;
    letter-spacing: 6px;
}

.games {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.game {
    padding: 9px 13px;
    border-radius: 8px;
    background: #2b2d31;
    color: #ddd;
}

.links a {
    color: #8ea1ff;
    text-decoration: none;
    margin-right: 15px;
}

.links a:hover {
    text-decoration: underline;
}

.footer {
    margin-top: 35px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.08);
    color: #777;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="window">

    <div class="topbar">
        <span>+</span>
        <span>−</span>
        <span>□</span>
        <span>
